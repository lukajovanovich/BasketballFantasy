<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Basketball Fantasy Hub</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <div class="page-shell">
        <header class="hero">
            <div class="hero__brand">
                <p class="hero__app-title">Basketball Fantasy</p>
                <div class="hero__landing-copy">
                    <p class="eyebrow">Basketball Fantasy</p>
                    <h1>Kontrolna tabla za ligu, statistiku i fantasy timove</h1>
                    <p class="hero__copy">
                        Jednostavan pregled projekta sa JWT prijavom, registracijom i brzim pristupom
                        svim glavnim resursima posle logovanja.
                    </p>
                </div>
            </div>

            <div class="hero__status" id="sessionSummary"></div>
        </header>

        <div class="layout">
            <aside class="sidebar">
                <div class="sidebar__card">
                    <p class="sidebar__label">Navigacija</p>
                    <nav id="navPanel" class="nav-list" aria-label="Glavna navigacija"></nav>
                </div>
            </aside>

            <main class="content">
                <section id="heroMetrics" class="metric-strip"></section>
                <section id="authSection"></section>
                <section id="workspace"></section>
            </main>
        </div>
    </div>

    <div id="toastStack" class="toast-stack" aria-live="polite" aria-atomic="true"></div>

    <script src="/app.js"></script>
</body>
</html>
